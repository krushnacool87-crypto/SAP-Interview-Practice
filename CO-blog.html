<!DOCTYPE html>
<html>
<head>
<title>SAP CO Blog</title>
<style>
button{
padding:10px 15px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:15px;
}
</style>
</head>
<body>
 
<h1>SAP CO Blog</h1>
<button onclick="window.location.href='index.html'">
🏠 Back to Home
</button>
<textarea id="coNotes"
style="
width:100%;
height:700px;
font-size:18px;
padding:10px;">
</textarea>
 
<br><br>
 
<button onclick="saveCONotes()">
💾 Save Notes
</button>
 
<script>
 
document.getElementById("coNotes").value =
localStorage.getItem("coNotes") || "";
 
function saveCONotes(){
 
const notes =
document.getElementById("coNotes").value;
 
localStorage.setItem(
"coNotes",
notes
);
 
alert("CO Notes Saved ✅");
}
 
</script>
 
</body>
</html>
