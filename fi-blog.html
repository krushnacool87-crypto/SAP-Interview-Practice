<!DOCTYPE html>
<html>
<head>
<title>SAP FI Blog</title>
<title>SAP FI Blog</title>
 
<style>
body{
font-family: Arial, sans-serif;
background:#ec9a9a;
padding:20px;
}
 
h1{
color:#1976d2;
}
 
button{
padding:10px 15px;
background:#1976d2;
color:rgb(202, 180, 180);
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:15px;
}
 
button:hover{
background:#125ea8;
}
 
textarea{
width:100%;
height:700px;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #63b675;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
</style>
</head>
</head>
<body>
<button onclick="window.location.href='index.html'">
🏠 Back to Home
</button>
<h1>SAP FI Blog</h1>
 
<textarea id="fiNotes"
style="
width:100%;
height:700px;
font-size:18px;
padding:10px;">
</textarea>
 
<br><br>
 
<button onclick="saveFINotes()">
💾 Save Notes
</button>
 
<script>
 
document.getElementById("fiNotes").value =
localStorage.getItem("fiNotes") || "";
 
function saveFINotes(){
 
const notes =
document.getElementById("fiNotes").value;
 
localStorage.setItem(
"fiNotes",
notes
);
 
alert("FI Notes Saved ✅");
}
 
</script>
 
</body>
</html>
