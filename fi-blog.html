<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP FI Blog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4d9d9, #e8f1ff);
      margin: 0;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      color: #1976d2;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 15px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #125ea8;
    }

    textarea {
      width: 100%;
      height: 700px;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #63b675;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      resize: vertical;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <button type="button" onclick="window.location.href='index.html'">🏠 Back to Home</button>
    <h1>SAP FI Blog</h1>

    <textarea id="fiNotes" placeholder="Write your FI notes here..."></textarea>
    <br><br>
    <button type="button" onclick="saveFINotes()">💾 Save Notes</button>
  </div>

  <script>
    document.getElementById("fiNotes").value = localStorage.getItem("fiNotes") || "";

    function saveFINotes() {
      const notes = document.getElementById("fiNotes").value;
      localStorage.setItem("fiNotes", notes);
      alert("FI Notes Saved ✅");
    }
  </script>
</body>
</html>
