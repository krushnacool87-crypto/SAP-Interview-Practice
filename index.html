<link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="container">
<div class="blog-buttons">

📘 FI Blog
</button>
 
<button onclick="location.href='co-blog.html'">
📗 CO Blog
</button>

<div id="blogEditor" style="display:none;">

<textarea id="blogText"

<button onclick="saveBlog()">
💾 Save Notes

</div>

placeholder="Search Question..."
><div class="upload-section">

 <p id="counter"></p>
