<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Practice App</title>
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    text-align: center;
    margin: 0;
    padding: 50px 20px 40px;
    transition: background 0.3s ease, color 0.3s ease;
}

body.dark-mode {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: 0 auto;
}

h1 {
    color: #ffffff;
    margin-bottom: 15px;
}

.community-sidebar {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 280px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
    padding: 14px;
    z-index: 1000;
    border: 1px solid rgba(255, 255, 255, 0.25);
}

.community-sidebar[hidden] {
    display: none;
}

.community-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 1001;
    padding: 11px 16px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 12px;
    background: #1976d2;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.community-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.community-header h3 {
    margin: 0 0 8px;
    color: #0d3b66;
    text-align: center;
    font-size: 1.2rem;
}

.community-close {
    flex: 0 0 auto;
    padding: 5px 9px;
    margin: 0;
    background: transparent;
    color: #475569;
    font-size: 1rem;
}

.community-close:hover {
    background: #e2e8f0;
}

.community-status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #1f7a1f;
    margin-bottom: 12px;
    font-weight: bold;
}

.community-status.connected {
    color: #1f7a1f;
}

.community-status.disconnected {
    color: #b42318;
}

.online-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
}

.community-modules {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
}

.community-module-btn {
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: #e6f0ff;
    color: #0d3b66;
    font-weight: bold;
    cursor: pointer;
}

.community-module-btn.active {
    background: #1976d2;
    color: white;
}

.community-members {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}

.community-member {
    background: #edf3ff;
    color: #1d4ed8;
    border: 1px solid #cfe0ff;
    font-size: 0.72rem;
    padding: 5px 8px;
    border-radius: 999px;
    font-weight: bold;
}

.community-chat {
    height: 220px;
    overflow-y: auto;
    background: #f5f7fb;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #dfe7f3;
}

.community-message {
    margin-bottom: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 0.82rem;
    line-height: 1.4;
}

.community-message.user {
    background: #d8ebff;
    margin-left: 20px;
}

.community-message.bot {
    background: #eef2f7;
    margin-right: 20px;
}

.community-message strong {
    display: block;
    margin-bottom: 3px;
    font-size: 0.72rem;
    color: #4b5563;
}

.community-name-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

.community-name-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cfe0f7;
}

.community-name-row button:disabled,
.community-input-row button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.community-input-row {
    display: flex;
    gap: 8px;
}

.community-input-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cfe0f7;
}

.community-input-row button {
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: #166eb6;
    color: white;
    cursor: pointer;
}

.community-hint {
    margin: 8px 2px 0;
    color: #64748b;
    font-size: 0.68rem;
    line-height: 1.4;
}

.top-actions {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 9999;
}

.blog-buttons,
.utility-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
}

.blog-buttons button,
.utility-buttons button {
    margin-left: 0;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.blog-buttons button:hover,
.utility-buttons button:hover {
    background: #125ea8;
}

#installAppButton[hidden] {
    display: none;
}

.search-row,
.toolbar-row,
.upload-section,
.action-row,
.bottom-actions,
.status-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px 0;
}

.filter-box {
    display: flex;
    align-items: center;
    gap: 8px;
    color: white;
    font-weight: bold;
}

#categoryFilter {
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    min-width: 120px;
}

.status-bar {
    justify-content: space-between;
    max-width: 500px;
    margin: 15px auto;
    color: white;
    font-weight: bold;
}

#searchInput,
#excelFile {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #cfcfcf;
    min-width: 260px;
}

#searchBtn,
#uploadBtn,
button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    background: #166eb6;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

#searchBtn:hover,
#uploadBtn:hover,
button:hover {
    background: #005ca8;
}

#uploadBtn {
    background: #28a745;
}

#uploadBtn:hover {
    background: #218838;
}

.question-box {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 15px;
    min-height: 160px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    margin-top: 20px;
}

body.dark-mode .question-box,
body.dark-mode #answer,
body.dark-mode #blogEditor,
body.dark-mode #favoritePanel,
body.dark-mode .filter-box,
body.dark-mode .status-bar,
body.dark-mode .community-sidebar {
    background: rgba(15, 23, 42, 0.9);
    color: #e2e8f0;
    border-color: #334155;
}

body.dark-mode .community-chat {
    background: #0f172a;
    border-color: #334155;
}

body.dark-mode .community-message.bot {
    background: #1e293b;
    color: #e2e8f0;
}

body.dark-mode .community-message.user {
    background: #1d4ed8;
    color: white;
}

body.dark-mode .community-header h3 {
    color: #e2e8f0;
}

body.dark-mode .community-close {
    color: #e2e8f0;
}

body.dark-mode .community-close:hover {
    background: #334155;
}

body.dark-mode .community-hint,
body.dark-mode .community-status {
    color: #cbd5e1;
}

body.dark-mode .community-name-row input,
body.dark-mode .community-input-row input {
    background: #1e293b;
    border-color: #475569;
    color: #e2e8f0;
}

#question {
    margin-top: 0;
    font-size: 1.5rem;
    color: #1d1d1d;
}

#answer {
    background: #ffffff;
    padding: 25px;
    margin-top: 20px;
    border-radius: 12px;
    text-align: left;
    font-family: Segoe UI, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.8;
    max-height: 500px;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid #ececec;
}

#answer p {
    margin: 0 0 10px 0;
}

.answer-label {
    color: #0f5dbd;
    font-weight: bold;
}

.answer-number {
    color: #0d3b66;
    font-weight: bold;
}

.answer-text {
    color: #222;
}

#counter {
    font-weight: bold;
    color: white;
    margin: 15px 0;
    font-size: 1.1rem;
}

#blogEditor {
    background: rgb(204, 160, 160);
    padding: 20px;
    margin: 20px auto;
    border-radius: 12px;
    width: 95%;
    max-width: 1100px;
}

#blogText {
    width: 100%;
    height: 500px;
    padding: 15px;
    font-size: 16px;
    border-radius: 10px;
    resize: vertical;
    box-sizing: border-box;
}

.favorite-panel {
    max-width: 900px;
    margin: 25px auto 0;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 12px;
    padding: 20px;
    text-align: left;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
}

.favorite-panel.hidden {
    display: none;
}

.favorite-item {
    padding: 10px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

.favorite-item:last-child {
    border-bottom: none;
}

@media (max-width: 1024px) {
    body {
        padding: 28px 18px 32px;
    }

    .container {
        width: 100%;
    }

    .community-sidebar {
        position: relative;
        top: auto;
        left: auto;
        box-sizing: border-box;
        width: min(100%, 520px);
        margin: 0 auto 18px;
    }

    .community-sidebar[hidden] {
        display: none;
    }

    .community-toggle {
        position: static;
        display: block;
        margin: 0 auto 14px;
    }

    .top-actions {
        position: static;
        justify-content: center;
        flex-wrap: wrap;
        margin: 0 0 20px;
    }
}

@media (max-width: 768px) {
    body {
        padding: 20px 14px 28px;
    }

    h1 {
        font-size: clamp(1.5rem, 6vw, 2rem);
        overflow-wrap: anywhere;
    }

    .blog-buttons,
    .utility-buttons {
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
    }

    .blog-buttons button,
    .utility-buttons button {
        min-height: 44px;
        margin: 0;
        padding: 10px 12px;
    }

    .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
    }

    #searchInput {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        font-size: 16px;
    }

    #searchBtn {
        min-height: 44px;
        margin: 0;
        padding: 10px 14px;
    }

    .toolbar-row {
        justify-content: space-between;
        gap: 8px;
    }

    .filter-box {
        min-height: 44px;
    }

    #categoryFilter {
        min-height: 44px;
    }

    #randomTestBtn {
        min-height: 44px;
        margin: 0;
        padding: 10px 12px;
    }

    .upload-section {
        flex-direction: column;
        gap: 8px;
    }

    #excelFile {
        width: min(100%, 360px);
        min-width: 0;
        box-sizing: border-box;
        font-size: 16px;
    }

    #uploadBtn {
        min-height: 44px;
        margin: 0;
    }

    .status-bar {
        justify-content: center;
        gap: 0 18px;
        text-align: center;
    }

    .status-bar p {
        margin: 6px 0;
    }

    .question-box {
        min-height: 0;
        padding: 22px 16px;
    }

    #question {
        font-size: clamp(1.2rem, 5vw, 1.5rem);
        overflow-wrap: anywhere;
    }

    #answer {
        box-sizing: border-box;
        max-height: 50vh;
        padding: 16px;
        font-size: 16px;
        overflow-wrap: anywhere;
    }

    .action-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .action-row button,
    .bottom-actions button {
        min-width: 0;
        min-height: 44px;
        margin: 0;
        padding: 10px 8px;
    }

    #reviewBtn {
        grid-column: 1 / -1;
    }

    .bottom-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    #blogEditor {
        box-sizing: border-box;
        width: 100%;
    }

    #blogText {
        min-height: 45vh;
    }

    .favorite-panel {
        box-sizing: border-box;
        padding: 16px;
    }

    .community-modules {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .community-module-btn {
        min-height: 44px;
        margin: 0;
    }

    .community-name-row button,
    .community-input-row button {
        min-height: 44px;
        margin: 0;
    }

    .community-name-row input,
    .community-input-row input {
        min-width: 0;
        box-sizing: border-box;
        font-size: 16px;
    }
}

@media (max-width: 420px) {
    body {
        padding: 16px 10px 24px;
    }

    .blog-buttons button,
    .utility-buttons button {
        padding: 9px 10px;
        font-size: 0.9rem;
    }

    .toolbar-row {
        justify-content: center;
    }

    .community-sidebar {
        padding: 12px;
    }

    .community-name-row,
    .community-input-row {
        gap: 6px;
    }

    .community-name-row input,
    .community-input-row input {
        padding: 9px 8px;
    }

    .question-box {
        padding: 18px 12px;
    }
}

  <script src="/socket.io/socket.io.js"></script>
  <script>
let current = 0;
let questions = [];
let allQuestions = [];
let answerVisible = false;
let activeCommunity = "FI";
let communityJoined = false;
let communityMessages = [];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let reviewedQuestions = new Set(JSON.parse(localStorage.getItem("reviewedQuestions") || "[]"));
const communityBus = "BroadcastChannel" in window ? new BroadcastChannel("sap-local-community") : null;
const communitySocket = typeof window.io === "function" ? window.io() : null;

function inferCategory(question, answer) {
  const text = `${question} ${answer}`.toLowerCase();
  if (/financial accounting|general ledger|accounts payable|accounts receivable|\bfi\b/.test(text)) return "FI";
  if (/cost center|controlling|profitability|\bco\b/.test(text)) return "CO";
  return "General";
}
function normalizeQuestion(item, index) {
  return { id: item.id || index + 1, question: String(item.question || ""), answer: String(item.answer || ""), category: item.category || inferCategory(item.question || "", item.answer || "") };
}
function updateProgress() {
  const reviewed = questions.filter((item) => reviewedQuestions.has(item.question)).length;
  document.getElementById("progressText").textContent = `Progress: ${reviewed} / ${questions.length}`;
}
function showQuestion(index) {
  const answer = document.getElementById("answer");
  if (!questions.length) {
    document.getElementById("question").textContent = "No questions in this category";
    document.getElementById("counter").textContent = "0 of 0";
    answer.style.display = "none";
    updateProgress();
    return;
  }
  current = (index + questions.length) % questions.length;
  document.getElementById("question").textContent = questions[current].question || "Untitled question";
  document.getElementById("counter").textContent = `Question ${current + 1} of ${questions.length}`;
  answer.style.display = "none";
  answer.replaceChildren();
  answerVisible = false;
  document.querySelector("[data-action='answer']").textContent = "Show Answer";
  document.getElementById("reviewBtn").textContent = reviewedQuestions.has(questions[current].question) ? "Reviewed" : "Mark Reviewed";
  updateProgress();
}
function toggleAnswer() {
  if (!questions.length) return;
  answerVisible = !answerVisible;
  const answer = document.getElementById("answer");
  answer.style.display = answerVisible ? "block" : "none";
  answer.replaceChildren();
  if (answerVisible) {
    const lines = (questions[current].answer || "No answer available yet.").split(/\n+/).map((line) => line.trim()).filter(Boolean);

  const entries = new Map();

  for (let entryIndex = 0; entryIndex < entryCount; entryIndex += 1) {
    if (directoryOffset + 46 > bytes.length || view.getUint32(directoryOffset, true) !== 0x02014b50) {
      throw new Error("The Excel file has a damaged ZIP directory.");
    }

    const flags = view.getUint16(directoryOffset + 8, true);
    const method = view.getUint16(directoryOffset + 10, true);
    const compressedSize = view.getUint32(directoryOffset + 20, true);
    const nameLength = view.getUint16(directoryOffset + 28, true);
    const extraLength = view.getUint16(directoryOffset + 30, true);
    const commentLength = view.getUint16(directoryOffset + 32, true);
    const localHeaderOffset = view.getUint32(directoryOffset + 42, true);
    const nameStart = directoryOffset + 46;
    const fileName = decoder.decode(bytes.subarray(nameStart, nameStart + nameLength));

    if (flags & 1) throw new Error("Password-protected Excel files are not supported.");
    entries.set(fileName, { method, compressedSize, localHeaderOffset });
    directoryOffset = nameStart + nameLength + extraLength + commentLength;
  }

  async function readEntry(fileName) {
    const entry = entries.get(fileName);
    if (!entry) return null;
    const offset = entry.localHeaderOffset;
    if (offset + 30 > bytes.length || view.getUint32(offset, true) !== 0x04034b50) {
      throw new Error(`The Excel file contains a damaged entry: ${fileName}`);
    }
    const nameLength = view.getUint16(offset + 26, true);
    const extraLength = view.getUint16(offset + 28, true);
    const dataStart = offset + 30 + nameLength + extraLength;
    const compressed = bytes.slice(dataStart, dataStart + entry.compressedSize);

    if (entry.method === 0) return decoder.decode(compressed);
    if (entry.method !== 8) throw new Error(`Unsupported compression in Excel file: ${fileName}`);
    if (typeof DecompressionStream === "undefined") {
      throw new Error("This browser cannot unpack .xlsx files. Open the app in a recent Chrome or Edge browser.");
    }

    try {
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(stream).text();
    } catch {
      throw new Error(`Could not decompress Excel worksheet data: ${fileName}`);
    }
  }

  function parseXml(xml, description) {
    if (!xml) throw new Error(`Excel workbook is missing ${description}.`);
    const document = new DOMParser().parseFromString(xml, "application/xml");
    if (document.querySelector("parsererror")) throw new Error(`Excel workbook contains invalid ${description}.`);
    return document;
  }

  const workbook = parseXml(await readEntry("xl/workbook.xml"), "workbook metadata");
  const firstSheet = workbook.getElementsByTagNameNS("*", "sheet")[0];
  if (!firstSheet) throw new Error("The Excel workbook has no worksheets.");

  const relationshipId = firstSheet.getAttributeNS(
    "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
    "id"
  );
  const relationships = parseXml(await readEntry("xl/_rels/workbook.xml.rels"), "worksheet relationships");
  const relationship = [...relationships.getElementsByTagNameNS("*", "Relationship")]
    .find((item) => item.getAttribute("Id") === relationshipId);
  if (!relationship) throw new Error("Could not locate the first Excel worksheet.");

  const target = relationship.getAttribute("Target") || "";
  const sheetPath = normalizeArchivePath(target.startsWith("/")
    ? target.slice(1)
    : `xl/${target}`);
  const worksheet = parseXml(await readEntry(sheetPath), "first worksheet");
  const sharedStringsXml = await readEntry("xl/sharedStrings.xml");
  const sharedStrings = sharedStringsXml
    ? [...parseXml(sharedStringsXml, "shared strings").getElementsByTagNameNS("*", "si")]
      .map((item) => [...item.getElementsByTagNameNS("*", "t")].map((text) => text.textContent || "").join(""))
    : [];

  return [...worksheet.getElementsByTagNameNS("*", "row")].map((row) => {
    const cells = [];
    [...row.getElementsByTagNameNS("*", "c")].forEach((cell) => {
      const reference = cell.getAttribute("r") || "";
      const letters = reference.match(/[A-Z]+/i);
      if (!letters) return;
      let column = 0;
      for (const letter of letters[0].toUpperCase()) {
        column = column * 26 + letter.charCodeAt(0) - 64;
      }
      column -= 1;

      const type = cell.getAttribute("t");
      let value = "";
      if (type === "inlineStr") {
        value = [...cell.getElementsByTagNameNS("*", "t")].map((text) => text.textContent || "").join("");
      } else {
        const valueElement = cell.getElementsByTagNameNS("*", "v")[0];
        value = valueElement ? valueElement.textContent || "" : "";
        if (type === "s" && value !== "") value = sharedStrings[Number(value)] ?? "";
        if (type === "b") value = value === "1" ? "TRUE" : "FALSE";
      }
      cells[column] = value;
    });
    return cells.map((value) => value ?? "");
  });
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const file = document.getElementById("excelFile").files[0];
  if (!file) {
    alert("Please select an Excel .xlsx file first.");
    return;
  }
  if (!file.name.toLowerCase().endsWith(".xlsx")) {
    alert("Please use the modern Excel .xlsx format. Legacy .xls files are not supported in this standalone offline app.");
    return;
  }
  if (file.size > 30 * 1024 * 1024) {
    alert("Excel file is too large. Please select a file smaller than 30 MB.");
    return;
  }

  const uploadButton = document.getElementById("uploadBtn");
  uploadButton.disabled = true;
  uploadButton.textContent = "Reading Excel...";
  try {
    const rows = await readXlsxArchive(await file.arrayBuffer());
    const firstRow = rows[0] || [];
    const dataRows = /question/i.test(String(firstRow[0] || "")) ? rows.slice(1) : rows;
    const imported = dataRows
      .filter((row) => row && row[0] !== undefined && String(row[0]).trim())
      .map((row, index) => ({
        id: index + 1,
        question: String(row[0]).trim(),
        answer: String(row[1] ?? "").trim(),
        category: String(row[2] ?? "").trim() || inferCategory(String(row[0]), String(row[1] ?? ""))
      }));

    if (!imported.length) {
      alert("No questions found. Use the first column for questions, second for answers, and optional third for category.");
      return;
    }

    allQuestions = imported.map(normalizeQuestion);
    localStorage.setItem("questions", JSON.stringify(allQuestions));
    applyCategoryFilter();
    alert(`${allQuestions.length} questions loaded successfully from ${file.name}.`);
  } catch (error) {
    console.error("Excel upload failed", error);
    alert(error.message || "Could not read the selected Excel workbook.");
  } finally {
    uploadButton.disabled = false;
    uploadButton.textContent = "📁 Upload Excel (.xlsx)";
  }
});

window.addEventListener("load", () => {
  const savedTheme = localStorage.getItem("themeMode"); if (savedTheme === "dark") { document.body.classList.add("dark-mode"); document.getElementById("themeToggle").textContent = "Light Mode"; }
  let savedQuestions = null; try { savedQuestions = JSON.parse(localStorage.getItem("questions") || "null"); } catch (error) { console.error("Saved questions could not be read", error); }
  allQuestions = Array.isArray(savedQuestions) && savedQuestions.length ? savedQuestions.map(normalizeQuestion) : (window.questions || []).map(normalizeQuestion);
  if (!savedQuestions && allQuestions.length) localStorage.setItem("questions", JSON.stringify(allQuestions));
  questions = [...allQuestions]; renderFavorites(); showQuestion(0);
  const name = localStorage.getItem("communityUsername") || ""; document.getElementById("communityName").value = name;
  loadCommunityMessages(); if (name) joinCommunityRoom();
});
document.getElementById("themeToggle").addEventListener("click", toggleDarkMode);
document.getElementById("favoriteToggle").addEventListener("click", toggleFavoritesPanel);
document.getElementById("shareAppButton").addEventListener("click", async () => {
  const shareData = {
    title: "SAP Interview Practice",
    text: "Practice SAP interview questions with SAP Interview Practice."
  };

  if (typeof window.AndroidApp?.shareApplication === "function") {
    window.AndroidApp.shareApplication();
    return;
  }

  if (navigator.share) {
    try {
      await navigator.share({ ...shareData, url: window.location.href });
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Could not share the app", error);
        alert("Could not share the app. Please try again.");
      }
    }
    return;
  }

  try {
    await navigator.clipboard.writeText(`${shareData.text} ${window.location.href}`);
    alert("App link copied. You can now share it with others.");
  } catch (error) {
    console.error("Could not copy the app link", error);
    alert("Could not share the app. Please copy the app link from your browser.");
  }
});
let pendingInstallPrompt = null;
const installAppButton = document.getElementById("installAppButton");
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  pendingInstallPrompt = event;
  installAppButton.hidden = false;
});
installAppButton.addEventListener("click", async () => {
  if (!pendingInstallPrompt) return;
  pendingInstallPrompt.prompt();
  await pendingInstallPrompt.userChoice;
  pendingInstallPrompt = null;
  installAppButton.hidden = true;
});
window.addEventListener("appinstalled", () => {
  pendingInstallPrompt = null;
  installAppButton.hidden = true;
});
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js").catch((error) => {
    console.error("App offline support could not be enabled", error);
  });
}
document.getElementById("categoryFilter").addEventListener("change", applyCategoryFilter);
document.getElementById("randomTestBtn").addEventListener("click", startRandomTest);
document.getElementById("reviewBtn").addEventListener("click", markReviewed);
document.getElementById("communitySendBtn").addEventListener("click", sendCommunityMessage);
document.getElementById("communityInput").addEventListener("keypress", (event) => { if (event.key === "Enter") sendCommunityMessage(); });
document.getElementById("communityJoinBtn").addEventListener("click", joinCommunityRoom);
document.getElementById("communityToggle").addEventListener("click", () => setCommunityPanelOpen(true));
document.getElementById("communityClose").addEventListener("click", () => setCommunityPanelOpen(false));
document.getElementById("communityName").addEventListener("keypress", (event) => { if (event.key === "Enter") joinCommunityRoom(); });
document.getElementById("searchInput").addEventListener("keypress", (event) => { if (event.key === "Enter") searchQuestion(); });
document.getElementById("searchBtn").addEventListener("click", searchQuestion);
document.querySelectorAll(".community-module-btn").forEach((button) => button.addEventListener("click", function () {
  activeCommunity = this.dataset.module;
  document.querySelectorAll(".community-module-btn").forEach((btn) => btn.classList.toggle("active", btn === this));
  if (communityJoined) joinCommunityRoom();
  else { loadCommunityMessages(); document.getElementById("communityMembers").replaceChildren(); setCommunityStatus(`Join ${activeCommunity} to chat`); }
}));
document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => {
  const action = button.dataset.action;
  if (action === "answer") toggleAnswer();
  if (action === "previous") showQuestion(current - 1);
  if (action === "next") showQuestion(current + 1);
  if (action === "random") { if (questions.length) showQuestion(Math.floor(Math.random() * questions.length)); }
}));
